@if (visible) {
<div class="modal-backdrop" (click)="cerrarModal()">
  <div class="modal-panel" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <h3>{{ isEdit ? '✏️ Editar Docente' : '➕ Nuevo Docente' }}</h3>
      <button type="button" class="modal-close" (click)="cerrarModal()" aria-label="Cerrar">×</button>
    </div>

    <div class="modal-body">

      @if (errorMessage) {
        <div class="alert alert-danger">⚠️ {{ errorMessage }}</div>
      }

      <form (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label class="form-label">Nombres *</label>
          <input type="text" class="form-control" [(ngModel)]="docente.nombres" name="nombres" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Apellidos *</label>
          <input type="text" class="form-control" [(ngModel)]="docente.apellidos" name="apellidos" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Identificación</label>
          <input type="text" class="form-control" [(ngModel)]="docente.identificacion" name="identificacion">
        </div>

        <div class="mb-3">
          <label class="form-label">Especialidad</label>
          <input type="text" class="form-control" [(ngModel)]="docente.especialidad" name="especialidad">
        </div>

        @if (!isEdit) {
          <hr>
          <h5>🔐 Datos de Usuario (Opcional)</h5>

          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" class="form-control" [(ngModel)]="docente.usuario" name="usuario">
          </div>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" [(ngModel)]="docente.password" name="password">
          </div>
        }

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            @if (loading) { <span class="spinner-border spinner-border-sm me-2"></span> }
            {{ loading ? 'Guardando...' : (isEdit ? 'Actualizar' : 'Crear') }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
}
