<!-- src/app/features/asignaturas/form-asignatura/form-asignatura.component.html -->
<!-- ✅ MODAL: fondo oscuro; clic afuera = cancelar -->
<div class="modal-overlay" (click)="cancelar()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="card shadow">

      <!-- ✅ MODAL: cabecera con botón × -->
      <div class="card-header d-flex justify-content-between align-items-center">
        <h4 class="mb-0">{{ isEdit ? '✏️ Editar Asignatura' : '➕ Nueva Asignatura' }}</h4>
        <button type="button" class="modal-close" (click)="cancelar()" title="Cerrar">×</button>
      </div>

      <div class="card-body">

        @if (errorMessage) {
          <div class="alert alert-danger">⚠️ {{ errorMessage }}</div>
        }
        @if (successMessage) {
          <div class="alert alert-success">{{ successMessage }}</div>
        }

        <form (ngSubmit)="onSubmit()">

          <!-- Nombre -->
          <div class="form-group">
            <label class="form-label">Nombre <span class="required">*</span></label>
            <input type="text" class="form-control"
              [(ngModel)]="asignatura.nombre" name="nombre"
              required placeholder="Ej: Matemáticas">
          </div>

          <!-- Código -->
          <div class="form-group">
            <label class="form-label">Código</label>
            <input type="text" class="form-control"
              [(ngModel)]="asignatura.codigo" name="codigo"
              placeholder="Ej: MAT-101">
          </div>

          <!-- Horas Semanales -->
          <div class="form-group">
            <label class="form-label">Horas Semanales <span class="required">*</span></label>
            <input type="number" class="form-control"
              [(ngModel)]="asignatura.horas_semanales" name="horas_semanales"
              required min="1" max="20" placeholder="Ej: 5">
          </div>

          <!-- Botones -->
          <div class="d-flex gap-2 mt-4 justify-content-end">
            <button type="button" class="btn btn-secondary" (click)="cancelar()">
              ❌ Cancelar
            </button>
            <button type="submit" class="btn btn-primary" [disabled]="loading">
              @if (loading) {
                <span class="spinner-border spinner-border-sm me-2"></span>
              }
              {{ loading ? 'Guardando...' : (isEdit ? '💾 Actualizar' : '➕ Crear') }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
