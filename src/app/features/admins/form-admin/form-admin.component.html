<div class="container">
  <div class="breadcrumb">
    <button class="crumb-btn" (click)="irADashboard()"><i class="ti ti-arrow-left"></i>Dashboard</button>
    <span class="crumb-sep">/</span>
    <button class="crumb-btn" (click)="cancelar()">Administradores</button>
    <span class="crumb-sep">/</span>
    <span class="crumb-current">{{ isEdit ? 'Editar' : 'Nuevo' }}</span>
  </div>
  <div class="card">
    
    <div class="card-header">
      <h4>{{ isEdit ? '✏️ Editar Administrador' : '👑 Nuevo Administrador' }}</h4>
    </div>
    <div class="card-body">

      @if (errorMessage) {
        <div class="alert alert-danger">⚠️ {{ errorMessage }}</div>
      }
      @if (successMessage) {
        <div class="alert alert-success">✅ {{ successMessage }}</div>
      }

      <form (ngSubmit)="onSubmit()">

        <div class="form-group">
          <label>Usuario *</label>
          <input type="text" class="form-control" [(ngModel)]="admin.usuario" name="usuario"
                 [readonly]="isEdit" required>
        </div>

        <div class="form-group">
          <label>Contraseña {{ isEdit ? '(dejar en blanco para no cambiar)' : '*' }}</label>
          <input type="password" class="form-control" [(ngModel)]="admin.password" name="password"
                 [required]="!isEdit" placeholder="Mínimo 6 caracteres">
        </div>

        <div class="d-flex">
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            {{ loading ? 'Guardando...' : (isEdit ? 'Actualizar' : 'Crear Administrador') }}
          </button>
          <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
        </div>

      </form>
    </div>
  </div>
</div>
